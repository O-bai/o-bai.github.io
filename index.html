<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>班级成绩查询</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080b10;
    --text: #e9eff8;
    --muted: #8a9ab0;
    --green: #34d399;
    --line: rgba(255, 255, 255, .08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(30px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
    font-family: var(--font);
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(16, 185, 129, .18), transparent 62%),
      radial-gradient(720px 420px at 105% 2%, rgba(59, 130, 246, .10), transparent 58%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .head, .search, .card, .foot { width: 100%; max-width: 520px; }

  /* ---------- 顶部 ---------- */

  .head { text-align: center; padding-top: 6px; }

  .pill {
    display: inline-block;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: .06em;
    color: #7ee2b8;
    background: rgba(52, 211, 153, .08);
    border: 1px solid rgba(52, 211, 153, .22);
  }

  h1 {
    margin: 16px 0 8px;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -.02em;
  }

  .head p {
    margin: 0;
    font-size: 14px;
    line-height: 1.65;
    color: var(--muted);
  }

  /* ---------- 搜索 ---------- */

  .search { margin-top: 26px; }

  .select-wrap { position: relative; }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 9px;
    height: 9px;
    border-right: 2px solid #8a9ab0;
    border-bottom: 2px solid #8a9ab0;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  select {
    width: 100%;
    height: 54px;
    padding: 0 46px 0 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }

  select:focus {
    border-color: rgba(52, 211, 153, .55);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, .12);
    background: rgba(255, 255, 255, .06);
  }

  select:disabled { opacity: .55; cursor: default; }

  select.is-placeholder { color: #5f7089; }

  select option {
    background: #111823;
    color: var(--text);
  }

  .input-wrap { display: flex; gap: 10px; margin-top: 10px; }

  .pass-wrap {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .pass-wrap[hidden] { display: none; }

  .pass-wrap input {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }

  .pass-wrap input::placeholder { color: #5f7089; }

  .pass-wrap input:focus {
    border-color: rgba(52, 211, 153, .55);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, .12);
    background: rgba(255, 255, 255, .06);
  }

  .pass-btn {
    flex: none;
    height: 54px;
    margin: 0;
    padding: 0 22px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    font-family: inherit;
    font-size: 17px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }

  input[type="text"]::placeholder { color: #5f7089; }

  input[type="text"]:focus {
    border-color: rgba(52, 211, 153, .55);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, .12);
    background: rgba(255, 255, 255, .06);
  }

  input[type="text"]:disabled { opacity: .55; }

  button {
    height: 54px;
    padding: 0 26px;
    border: 0;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #04120c;
    background: linear-gradient(180deg, #4ade80, #22c55e);
    box-shadow: 0 12px 26px -12px rgba(34, 197, 94, .85);
    transition: transform .15s, opacity .2s, box-shadow .2s;
  }

  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

  .msg {
    min-height: 19px;
    margin: 10px 2px 0;
    font-size: 13px;
    line-height: 1.5;
    color: #ff8f8f;
  }

  .meta {
    margin: 4px 2px 0;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    color: #5f7089;
  }

  .shake { animation: shake .38s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
  }

  /* ---------- 成绩卡片 ---------- */

  .card {
    margin-top: 20px;
    padding: 20px;
    border-radius: 26px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(24, 33, 47, .94), rgba(13, 19, 28, .96));
    box-shadow: 0 30px 70px -34px #000, inset 0 1px 0 rgba(255, 255, 255, .05);
    scroll-margin-top: 24px;
  }

  .card[hidden] { display: none; }

  .card.show { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: none; }
  }

  .card-head { display: flex; align-items: center; gap: 14px; }

  .avatar {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 21px;
    font-weight: 800;
    color: #0a1a12;
    background: linear-gradient(145deg, #6ee7b7, #22c55e);
    box-shadow: 0 8px 20px -8px rgba(34, 197, 94, .7);
  }

  .who h2 {
    margin: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 21px;
    line-height: 1.3;
    letter-spacing: -.01em;
  }

  .who .cls {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    color: #7ee2b8;
    background: rgba(52, 211, 153, .10);
    border: 1px solid rgba(52, 211, 153, .22);
  }

  .selection { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .hero {
    margin-top: 18px;
    padding: 22px 16px 18px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid rgba(52, 211, 153, .2);
    background:
      radial-gradient(120% 130% at 50% 0%, rgba(16, 185, 129, .16), rgba(16, 185, 129, 0) 62%),
      rgba(255, 255, 255, .02);
  }

  .hero-label {
    margin: 0;
    font-size: 12px;
    letter-spacing: .22em;
    color: #7ee2b8;
  }

  .hero-total {
    margin: 10px 0 0;
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--green);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 38px rgba(52, 211, 153, .35);
  }

  .hero-total small {
    margin-left: 6px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0;
    color: #7ee2b8;
  }

  .hero-total.is-empty {
    font-size: 36px;
    color: #5f7089;
    text-shadow: none;
    letter-spacing: 0;
  }

  .hero-total.is-empty small { display: none; }

  .hero-rank {
    margin: 12px 0 0;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 8px;
    font-size: 14px;
    color: #b9c8db;
  }

  .hero-rank .rk-label {
    font-size: 12px;
    letter-spacing: .12em;
    color: #7ee2b8;
  }

  .hero-rank b { color: #fff; font-weight: 700; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 8px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .03);
    text-align: center;
  }

  .stat span { font-size: 11px; color: var(--muted); }

  .stat b {
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    color: #f2f7ff;
  }

  .grid-label {
    margin: 20px 0 10px;
    font-size: 12px;
    letter-spacing: .18em;
    color: #6e8099;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .subject {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .035);
  }

  .subject .k { font-size: 13px; color: var(--muted); }

  .subject .v {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #f2f7ff;
  }

  .subject .sc {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }

  .subject .yf {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    color: #7ee2b8;
    white-space: nowrap;
  }

  .subject.show {
    animation: rise .5s both;
    animation-delay: calc(var(--i, 0) * 55ms);
  }

  .empty {
    grid-column: 1 / -1;
    margin: 0;
    padding: 18px 5px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  .foot {
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    line-height: 1.7;
    color: #4c5c72;
  }

  /* ---------- 全班排名榜 ---------- */

  .rank-toggle {
    width: 100%;
    height: 52px;
    margin-top: 20px;
    border: 1px solid rgba(52, 211, 153, .35);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(52, 211, 153, .16), rgba(52, 211, 153, .07));
    color: #a7f3d0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    box-shadow: 0 10px 24px -16px rgba(34, 197, 94, .8);
  }

  .rank-toggle:hover:not(:disabled) {
    background: linear-gradient(180deg, rgba(52, 211, 153, .22), rgba(52, 211, 153, .1));
    transform: translateY(-1px);
  }

  .rank-panel {
    width: 100%;
    max-width: 520px;
    margin-top: 16px;
    scroll-margin-top: 20px;
  }

  .rank-panel[hidden] { display: none; }

  .rank-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .rank-head h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.01em;
  }

  .rank-sub {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .csv-btn {
    flex: none;
    height: 38px;
    margin: 0;
    padding: 0 13px;
    border: 1px solid rgba(52, 211, 153, .3);
    border-radius: 11px;
    background: rgba(52, 211, 153, .08);
    color: #7ee2b8;
    font-size: 12.5px;
    font-weight: 700;
    box-shadow: none;
  }

  .csv-btn:hover:not(:disabled) {
    background: rgba(52, 211, 153, .14);
    transform: none;
  }

  .rank-hint {
    margin: 12px 2px 10px;
    font-size: 12px;
    color: #6e8099;
  }

  .table-responsive {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #0b1119;
  }

  .rank-table {
    width: 700px;
    min-width: 700px;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    white-space: nowrap;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .rank-table th,
  .rank-table td {
    padding: 11px 8px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, .055);
  }

  .rank-table thead th {
    background: #18212f;
    color: #9fb0c6;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
  }

  .rank-table tbody tr:nth-child(odd) td { background: #0f1620; }
  .rank-table tbody tr:nth-child(even) td { background: #0c121a; }

  .rank-table tbody tr:last-child td { border-bottom: 0; }

  .rank-table th.sticky,
  .rank-table td.sticky {
    position: sticky;
    z-index: 10;
  }

  .rank-table .col-rank { left: 0; }

  .rank-table .col-name {
    left: 62px;
    box-shadow: 1px 0 0 rgba(255, 255, 255, .07);
  }

  .rank-table td.col-name {
    text-align: left;
    padding-left: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-table td.col-rank { color: #8a9ab0; }

  .rank-table td.total {
    color: #7ee2b8;
    font-weight: 700;
  }

  .rank-empty {
    margin: 0;
    padding: 22px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- 重名学生选择 ---------- */

  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  .modal[hidden] { display: none; }

  .modal-mask {
    position: absolute;
    inset: 0;
    background: rgba(3, 7, 12, .74);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: fade .2s ease;
  }

  .modal-box {
    position: relative;
    width: min(100%, 400px);
    padding: 22px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, #18212f, #0d131c);
    box-shadow: 0 40px 90px -30px #000;
    animation: pop .28s cubic-bezier(.2, .8, .2, 1);
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to { opacity: 1; transform: none; }
  }

  .modal-box h3 { margin: 0; font-size: 18px; }
  .modal-hint { margin: 6px 0 16px; font-size: 13px; line-height: 1.6; color: var(--muted); }

  .pick {
    display: flex;
    width: 100%;
    height: auto;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .04);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    box-shadow: none;
  }

  .pick:hover:not(:disabled) {
    background: rgba(52, 211, 153, .08);
    border-color: rgba(52, 211, 153, .35);
    transform: none;
  }

  .pick .pick-sub {
    flex: none;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  button:focus-visible {
    outline: 2px solid rgba(52, 211, 153, .65);
    outline-offset: 2px;
  }

  .modal-cancel {
    width: 100%;
    height: 46px;
    margin-top: 4px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255, 255, 255, .04);
    color: #c6d3e4;
    font-size: 15px;
    font-weight: 600;
    box-shadow: none;
  }

  .modal-cancel:hover:not(:disabled) {
    background: rgba(255, 255, 255, .07);
    transform: none;
  }

  @media (max-width: 380px) {
    h1 { font-size: 26px; }
    .hero-total { font-size: 54px; }
    button { padding: 0 20px; }
    .card { padding: 16px; border-radius: 22px; }
    .avatar { width: 46px; height: 46px; font-size: 19px; }
    .who h2 { font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card.show, .subject.show, .shake, .modal-box, .modal-mask { animation: none !important; }
  }
</style>
</head>
<body>

<header class="head">
  <span class="pill">成绩查询 · 全年级可查</span>
  <h1>班级成绩查询</h1>
  <p>选择班级、输入姓名，查看卷面总分、联考排名与各科成绩</p>
</header>

<main class="search">
  <div class="select-wrap">
    <select id="inpClass" aria-label="选择班级" disabled>
      <option value="">请选择班级</option>
    </select>
  </div>

  <div class="pass-wrap" id="passWrap" hidden>
    <input id="classPass" type="password" placeholder="请输入班级密码" autocomplete="current-password" enterkeyhint="go">
    <button type="button" class="pass-btn" id="passBtn">验证</button>
  </div>

  <div class="input-wrap" id="inputWrap">
    <input id="nameInput" type="text" placeholder="请输入姓名" autocomplete="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="search" disabled>
    <button id="queryBtn" disabled>查询</button>
  </div>

  <p class="msg" id="msg" aria-live="polite"></p>
  <p class="meta" id="meta">正在加载成绩数据…</p>

  <button type="button" class="rank-toggle" id="rankToggle" disabled>🏆 查看全班排名榜</button>
</main>

<section class="rank-panel" id="rankPanel" hidden>
  <div class="rank-head">
    <div>
      <h2 id="rankTitle">全班排名榜</h2>
      <p class="rank-sub" id="rankSub">按赋分总分从高到低排序</p>
    </div>
    <button type="button" class="csv-btn" id="csvBtn">📥 导出为 CSV</button>
  </div>

  <p class="rank-hint">💡 提示：左右滑动可查看各科成绩</p>

  <div class="table-responsive">
    <table class="rank-table">
      <colgroup>
        <col style="width:62px">
        <col style="width:94px">
        <col style="width:88px">
        <col style="width:76px">
        <col style="width:76px">
        <col style="width:76px">
        <col style="width:76px">
        <col style="width:76px">
        <col style="width:76px">
      </colgroup>
      <thead>
        <tr>
          <th class="sticky col-rank">名次</th>
          <th class="sticky col-name">姓名</th>
          <th>总分</th>
          <th>语文</th>
          <th>数学</th>
          <th>外语</th>
          <th>物理</th>
          <th>化学</th>
          <th>生物</th>
        </tr>
      </thead>
      <tbody id="rankBody"></tbody>
    </table>
  </div>
</section>

<section class="card" id="card" hidden aria-live="polite">
  <div class="card-head">
    <div class="avatar" id="avatar">—</div>
    <div class="who">
      <h2><span class="cls" id="sClass">—</span><span id="sName">—</span></h2>
      <p class="selection" id="sSelection">—</p>
    </div>
  </div>

  <div class="hero">
    <p class="hero-label">卷面总分</p>
    <p class="hero-total"><span id="sTotal">-</span><small>分</small></p>
    <p class="hero-rank">
      <span class="rk-label">联考排名</span>
      <b id="sRank">-</b>
    </p>
  </div>

  <div class="stats">
    <div class="stat"><span>赋分总分</span><b id="sFufen">-</b></div>
    <div class="stat"><span>学校排名</span><b id="sSchoolRank">-</b></div>
    <div class="stat"><span>班级排名</span><b id="sClassRank">-</b></div>
  </div>

  <p class="grid-label">各科成绩</p>
  <div class="grid" id="sGrid"></div>
</section>

<footer class="foot">数据仅在本地浏览器中加载，不会上传到任何服务器</footer>

<div class="modal" id="pickModal" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h3 id="pickTitle">找到多名同名学生</h3>
    <p class="modal-hint" id="pickHint">请选择要查看的同学</p>
    <div id="pickList"></div>
    <button type="button" class="modal-cancel" id="pickCancel">取消</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // 班级访问密码：空字符串表示该班级无需密码
  const CLASS_PASSWORDS = {
    '774': '',
    '732': '888888',
    '733': '123456'
  };

  var select = document.getElementById('inpClass');
  var input = document.getElementById('nameInput');
  var btn = document.getElementById('queryBtn');
  var msgEl = document.getElementById('msg');
  var metaEl = document.getElementById('meta');
  var card = document.getElementById('card');
  var inputWrap = document.getElementById('inputWrap');

  var rankPanel = document.getElementById('rankPanel');
  var rankToggle = document.getElementById('rankToggle');
  var rankBody = document.getElementById('rankBody');
  var rankTitle = document.getElementById('rankTitle');
  var rankSub = document.getElementById('rankSub');
  var csvBtn = document.getElementById('csvBtn');

  var passWrap = document.getElementById('passWrap');
  var passInput = document.getElementById('classPass');
  var passBtn = document.getElementById('passBtn');

  var SUBJECT_KEYS = ['语文', '数学', '外语', '物理', '化学', '生物'];

  var pickModal = document.getElementById('pickModal');
  var pickList = document.getElementById('pickList');
  var pickTitle = document.getElementById('pickTitle');
  var pickHint = document.getElementById('pickHint');
  var pickCancel = document.getElementById('pickCancel');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var index = new Map(); // 班级 + \u0000 + 姓名 => [记录, ...]
  var allRecords = [];
  var rankRows = [];
  var unlockedClasses = {};
  var loaded = false;
  var lastFocus = null;

  /* ---------- 工具函数 ---------- */

  function norm(v) {
    return String(v == null ? '' : v).replace(/[\s\u3000]/g, '').toLowerCase();
  }

  function fmt(v) {
    if (v === null || v === undefined) return '-';
    var s = String(v).trim();
    if (s === '') return '-';
    var n = Number(s);
    if (isFinite(n)) return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
    return s;
  }

  function classText(c) {
    var s = String(c == null ? '' : c).trim();
    if (!s) return '';
    if (/^\d+$/.test(s)) return s + '班';
    if (/班$/.test(s)) return s;
    return s;
  }

  function sortClass(a, b) {
    var na = Number(a);
    var nb = Number(b);
    var fa = a !== '' && isFinite(na);
    var fb = b !== '' && isFinite(nb);
    if (fa && fb) return na - nb;
    if (fa !== fb) return fa ? -1 : 1;
    return String(a).localeCompare(String(b), 'zh-Hans-CN');
  }

  function showMsg(text) {
    msgEl.textContent = text || '';
  }

  function syncSelectStyle() {
    select.classList.toggle('is-placeholder', !select.value);
  }

  function hideCard() {
    card.hidden = true;
    card.classList.remove('show');
  }

  function shake() {
    if (reduced) return;
    inputWrap.classList.remove('shake');
    void inputWrap.offsetWidth;
    inputWrap.classList.add('shake');
    setTimeout(function () { inputWrap.classList.remove('shake'); }, 450);
  }

  function scrollToCard() {
    if (reduced) {
      card.scrollIntoView({ block: 'start' });
      return;
    }
    setTimeout(function () {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  }

  /* ---------- 班级密码 ---------- */

  function classPassword(cls) {
    if (!cls) return '';
    if (!Object.prototype.hasOwnProperty.call(CLASS_PASSWORDS, cls)) return '';
    return String(CLASS_PASSWORDS[cls] || '');
  }

  function classUnlocked(cls) {
    if (!cls) return false;
    return classPassword(cls) === '' || unlockedClasses[cls] === true;
  }

  function updateClassGate() {
    var cls = select.value;
    var needPass = cls !== '' && classPassword(cls) !== '' && unlockedClasses[cls] !== true;

    passWrap.hidden = !needPass;

    if (needPass) {
      input.disabled = true;
      btn.disabled = true;
      rankToggle.disabled = true;
    } else if (loaded) {
      input.disabled = false;
      btn.disabled = false;
      rankToggle.disabled = false;
    }
  }

  function verifyClassPassword() {
    var cls = select.value;
    if (!cls) {
      showMsg('请先选择班级');
      return;
    }

    var pwd = classPassword(cls);
    if (pwd === '' || unlockedClasses[cls] === true) {
      updateClassGate();
      input.focus();
      return;
    }

    if (passInput.value === pwd) {
      unlockedClasses[cls] = true;
      passInput.value = '';
      showMsg('');
      updateClassGate();
      input.focus();
    } else {
      showMsg('密码错误，请重新输入');
      passInput.value = '';
      passInput.focus();
    }
  }

  /* ---------- 全班排名榜 ---------- */

  function totalOf(rec) {
    // 排名榜按“赋分总分”排序；缺失时依次回退到卷面总分、各科求和
    var f = rec.fufen_total;
    if (f !== null && f !== undefined && String(f).trim() !== '') {
      var fn = Number(f);
      if (isFinite(fn)) return Math.round(fn * 100) / 100;
    }

    var raw = rec.total_score;
    if (raw !== null && raw !== undefined && String(raw).trim() !== '') {
      var rn = Number(raw);
      if (isFinite(rn)) return Math.round(rn * 100) / 100;
    }

    var sum = 0;
    var scores = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects : {};
    Object.keys(scores).forEach(function (k) {
      var n = Number(scores[k]);
      if (isFinite(n)) sum += n;
    });
    return Math.round(sum * 100) / 100;
  }

  function buildRanking(cls) {
    var items = [];
    allRecords.forEach(function (rec) {
      var c = String(rec['class'] == null ? '' : rec['class']).trim();
      if (c !== cls) return;
      items.push({ rec: rec, total: totalOf(rec) });
    });

    items.sort(function (a, b) {
      if (b.total !== a.total) return b.total - a.total;
      return String(a.rec.name).localeCompare(String(b.rec.name), 'zh-Hans-CN');
    });

    var prev = null;
    var rank = 0;
    items.forEach(function (it, i) {
      if (prev === null || it.total !== prev) {
        rank = i + 1;
        prev = it.total;
      }
      it.rank = rank;
    });

    return items;
  }

  function renderRanking() {
    var cls = select.value;
    if (!cls) {
      closeRanking();
      showMsg('请先选择班级');
      select.focus();
      return;
    }

    rankRows = buildRanking(cls);
    rankTitle.textContent = classText(cls) + ' 全班排名榜';
    rankSub.textContent = '共 ' + rankRows.length + ' 人 · 按赋分总分从高到低排序';

    rankBody.textContent = '';

    if (!rankRows.length) {
      var emptyRow = document.createElement('tr');
      var emptyCell = document.createElement('td');
      emptyCell.colSpan = 9;
      emptyCell.className = 'rank-empty';
      emptyCell.textContent = '该班级暂无成绩数据';
      emptyRow.appendChild(emptyCell);
      rankBody.appendChild(emptyRow);
      return;
    }

    rankRows.forEach(function (it) {
      var rec = it.rec;
      var tr = document.createElement('tr');

      var tdRank = document.createElement('td');
      tdRank.className = 'sticky col-rank';
      tdRank.textContent = String(it.rank);
      tr.appendChild(tdRank);

      var tdName = document.createElement('td');
      tdName.className = 'sticky col-name';
      tdName.textContent = String(rec.name == null ? '' : rec.name);
      tr.appendChild(tdName);

      var tdTotal = document.createElement('td');
      tdTotal.className = 'total';
      tdTotal.textContent = fmt(it.total);
      tr.appendChild(tdTotal);

      SUBJECT_KEYS.forEach(function (k) {
        var td = document.createElement('td');
        var v = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects[k] : '';
        td.textContent = (v === null || v === undefined || String(v).trim() === '') ? '-' : fmt(v);
        tr.appendChild(td);
      });

      rankBody.appendChild(tr);
    });
  }

  function closeRanking() {
    rankPanel.hidden = true;
    rankToggle.textContent = '🏆 查看全班排名榜';
  }

  function toggleRanking() {
    if (!rankPanel.hidden) {
      closeRanking();
      return;
    }

    var cls = select.value;
    if (!cls) {
      showMsg('请先选择班级');
      select.focus();
      return;
    }

    if (!classUnlocked(cls)) {
      showMsg('该班级需要密码，请先输入班级密码');
      passInput.focus();
      return;
    }

    showMsg('');
    renderRanking();
    rankPanel.hidden = false;
    rankToggle.textContent = '收起排名榜';

    if (!reduced) {
      setTimeout(function () {
        rankPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }
  }

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function saveFile(name, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function exportCsv() {
    if (!rankRows.length) return;

    var lines = [];
    lines.push(['名次', '姓名', '总分'].concat(SUBJECT_KEYS).map(csvCell).join(','));

    rankRows.forEach(function (it) {
      var rec = it.rec;
      var row = [it.rank, rec.name, it.total];
      SUBJECT_KEYS.forEach(function (k) {
        var v = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects[k] : '';
        row.push(v === null || v === undefined ? '' : v);
      });
      lines.push(row.map(csvCell).join(','));
    });

    saveFile('班级成绩排名.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  }

  /* ---------- 渲染 ---------- */

  function render(rec) {
    var name = String(rec.name == null ? '' : rec.name).trim();
    var key = norm(name);
    var cls = String(rec['class'] == null ? '' : rec['class']).trim();

    document.getElementById('avatar').textContent = key ? key.slice(0, 1).toUpperCase() : '·';
    document.getElementById('sName').textContent = name || '—';

    var clsEl = document.getElementById('sClass');
    clsEl.textContent = classText(cls) || '—';
    clsEl.style.display = cls ? '' : 'none';

    var type = rec.type == null ? '' : String(rec.type).trim();
    document.getElementById('sSelection').textContent = type || '选科信息未填写';

    var totalText = fmt(rec.total_score);
    var totalEl = document.getElementById('sTotal');
    totalEl.textContent = totalText;
    totalEl.parentElement.classList.toggle('is-empty', totalText === '-');

    var rankText = fmt(rec.rank);
    document.getElementById('sRank').textContent = rankText === '-' ? '-' : '第' + rankText + '名';

    document.getElementById('sFufen').textContent = fmt(rec.fufen_total);
    document.getElementById('sSchoolRank').textContent = fmt(rec.school_rank);
    document.getElementById('sClassRank').textContent = fmt(rec.class_rank);

    var grid = document.getElementById('sGrid');
    grid.textContent = '';

    function hasVal(v) {
      return v !== null && v !== undefined && String(v).trim() !== '';
    }

    var scores = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects
               : (rec.scores && typeof rec.scores === 'object') ? rec.scores
               : {};
    var fufen = (rec.subjects_fufen && typeof rec.subjects_fufen === 'object') ? rec.subjects_fufen : {};

    var names = Object.keys(scores);
    Object.keys(fufen).forEach(function (k) {
      if (names.indexOf(k) === -1) names.push(k);
    });

    var entries = names.filter(function (k) {
      return k && (hasVal(scores[k]) || hasVal(fufen[k]));
    });

    if (!entries.length) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '该同学暂无科目成绩数据';
      grid.appendChild(empty);
    } else {
      entries.forEach(function (k, i) {
        var item = document.createElement('div');
        item.className = 'subject' + (reduced ? '' : ' show');
        item.style.setProperty('--i', String(i));

        var kk = document.createElement('span');
        kk.className = 'k';
        kk.textContent = k;

        var sc = document.createElement('span');
        sc.className = 'sc';

        var vv = document.createElement('span');
        vv.className = 'v';
        vv.textContent = hasVal(scores[k]) ? fmt(scores[k]) : '-';
        sc.appendChild(vv);

        if (hasVal(fufen[k])) {
          var yf = document.createElement('span');
          yf.className = 'yf';
          yf.textContent = '赋分 ' + fmt(fufen[k]);
          sc.appendChild(yf);
        }

        item.appendChild(kk);
        item.appendChild(sc);
        grid.appendChild(item);
      });
    }

    card.hidden = false;
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');

    scrollToCard();
  }

  /* ---------- 重名选择 ---------- */

  function openPicker(list, cls) {
    var label = classText(cls);
    pickTitle.textContent = label + '有 ' + list.length + ' 名「' +
      String(list[0].name == null ? '' : list[0].name).trim() + '」';
    pickHint.textContent = '请选择要查看的同学';

    pickList.textContent = '';
    list.forEach(function (rec) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';

      var main = document.createElement('span');
      var t = fmt(rec.total_score);
      main.textContent = t === '-' ? '总分 -' : '总分 ' + t + ' 分';

      var sub = document.createElement('span');
      sub.className = 'pick-sub';
      sub.textContent = '排名 ' + fmt(rec.rank);

      b.appendChild(main);
      b.appendChild(sub);
      b.addEventListener('click', function () {
        closePicker();
        render(rec);
      });

      pickList.appendChild(b);
    });

    lastFocus = document.activeElement;
    pickModal.hidden = false;

    var first = pickList.querySelector('button');
    if (first) first.focus();
  }

  function closePicker() {
    pickModal.hidden = true;
    pickList.textContent = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  /* ---------- 查询 ---------- */

  function query() {
    if (!loaded) return;

    var cls = select.value;
    var key = norm(input.value);

    if (cls && !classUnlocked(cls)) {
      showMsg('该班级需要密码，请先输入班级密码');
      passInput.focus();
      return;
    }

    if (!cls || !key) {
      showMsg('请选择班级并输入姓名');
      if (!cls) select.focus();
      else input.focus();
      return;
    }

    var list = index.get(cls + '\u0000' + key) || [];

    if (!list.length) {
      hideCard();
      showMsg('未找到该姓名');
      shake();
      return;
    }

    showMsg('');

    if (list.length > 1) {
      openPicker(list, cls);
      return;
    }

    render(list[0]);
  }

  /* ---------- 初始化 ---------- */

  async function boot() {
    try {
      var res = await fetch('grades.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      var data = await res.json();
      if (!Array.isArray(data) || !data.length) throw new Error('数据为空');

      var classMap = {};

      data.forEach(function (rec) {
        if (!rec || rec.name == null) return;
        var cls = String(rec['class'] == null ? '' : rec['class']).trim();
        var key = norm(rec.name);
        if (!cls || !key) return;

        classMap[cls] = true;
        allRecords.push(rec);
        var id = cls + '\u0000' + key;
        if (!index.has(id)) index.set(id, []);
        index.get(id).push(rec);
      });

      var classes = Object.keys(classMap).sort(sortClass);

      classes.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = classText(c);
        select.appendChild(opt);
      });

      loaded = true;
      select.disabled = false;
      input.disabled = false;
      btn.disabled = false;
      rankToggle.disabled = false;
      syncSelectStyle();

      metaEl.textContent = '已加载 ' + data.length + ' 名同学 · ' + classes.length + ' 个班级 · 数据仅存于本机';

      var params = new URLSearchParams(location.search);
      var presetClass = (params.get('class') || '').trim();
      var presetName = params.get('name') || '';

      if (presetClass) {
        var found = false;
        for (var i = 0; i < select.options.length; i++) {
          if (select.options[i].value === presetClass) { found = true; break; }
        }
        if (found) select.value = presetClass;
        syncSelectStyle();
      }

      if (presetName) input.value = presetName;
      updateClassGate();

      if (presetName && classUnlocked(select.value)) {
        query();
      } else if (select.value && !classUnlocked(select.value)) {
        passInput.focus();
      } else {
        select.focus({ preventScroll: true });
      }
    } catch (err) {
      console.error(err);
      metaEl.textContent = '成绩数据加载失败';
      showMsg('未找到 grades.json：请先用 extract.html 生成，并与本页放在同一目录。' +
              '需通过本地服务器或网站访问，直接双击打开可能被浏览器拦截。');
      select.disabled = true;
      input.disabled = true;
      btn.disabled = true;
    }
  }

  /* ---------- 事件绑定 ---------- */

  btn.addEventListener('click', query);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      query();
    }
  });

  input.addEventListener('input', function () {
    if (msgEl.textContent) showMsg('');
  });

  select.addEventListener('change', function () {
    syncSelectStyle();
    if (msgEl.textContent) showMsg('');
    hideCard();

    passInput.value = '';
    updateClassGate();
    if (!passWrap.hidden) passInput.focus();

    if (!rankPanel.hidden) {
      if (select.value && classUnlocked(select.value)) renderRanking();
      else closeRanking();
    }
  });

  rankToggle.addEventListener('click', toggleRanking);
  csvBtn.addEventListener('click', exportCsv);

  passBtn.addEventListener('click', verifyClassPassword);
  passInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      verifyClassPassword();
    }
  });

  pickCancel.addEventListener('click', closePicker);

  pickModal.addEventListener('click', function (e) {
    if (e.target && e.target.getAttribute('data-close')) closePicker();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !pickModal.hidden) closePicker();
  });

  boot();
})();
</script>
</body>
</html>
